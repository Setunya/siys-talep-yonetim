<!DOCTYPE html>
<html lang="tr"> 
<head> 
    <meta charset="UTF-8"> 
    <title>{% block baslik %}SİYS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">SİYS - Talep Yönetim Sistemi</span>

        {% if user.is_authenticated %}
        <div class="d-flex align-items-center">
            <a href="{% url 'bildirimler' %}" class="text-light me-3 text-decoration-none">
                🔔
                {% if bildirim_sayisi > 0 %}
                    <span class="badge bg-danger">{{ bildirim_sayisi }}</span>
                {% endif %}
            </a>
            <span class="text-light me-3">{{ user.username }}</span>
            <a href="{% url 'cikis' %}" class="btn btn-sm btn-outline-light">Çıkış</a>
        </div>
        {% endif %}
        
    </div>
</nav>
<div class="container mt-4">
    {% block icerik %} {% endblock %}
</div>

</body>
</html>
