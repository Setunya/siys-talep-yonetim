{% extends 'base.html' %}

{% block baslik %}Bildirimler{% endblock %}

{% block icerik %}

<style>
  .bildirim-ikon { width:38px; height:38px; }
  .bildirim-ikon.yeni   { background:#e5eefc; color:#1a5fb4; }
  .bildirim-ikon.okundu { background:#eef1f5; color:#8895a7; }
</style>

<div class="sayfa-basligi">
  <h3><i class="bi bi-bell"></i> Bildirimler</h3>
</div>

<div class="card">
  <div class="list-group list-group-flush">
    {% for bildirim in liste %}
      <a href="{% url 'talep_detay' bildirim.talep.id %}"
         class="list-group-item list-group-item-action d-flex align-items-start gap-3 py-3">
        <span class="bildirim-ikon d-inline-flex align-items-center justify-content-center rounded-circle flex-shrink-0 {% if bildirim.okundu %}okundu{% else %}yeni{% endif %}">
          <i class="bi bi-envelope{% if not bildirim.okundu %}-fill{% endif %}"></i>
        </span>
        <div class="flex-grow-1">
          <div class="{% if not bildirim.okundu %}fw-semibold{% endif %}">{{ bildirim.mesaj }}</div>
          <small class="text-muted"><i class="bi bi-clock me-1"></i>{{ bildirim.tarih|date:"d.m.Y H:i" }}</small>
        </div>
        {% if not bildirim.okundu %}<span class="badge soft-primary align-self-center">Yeni</span>{% endif %}
      </a>
    {% empty %}
      <div class="text-center text-muted py-5">
        <i class="bi bi-bell-slash fs-2 d-block mb-2 opacity-50"></i>
        Bildiriminiz yok.
      </div>
    {% endfor %}
  </div>
</div>

{% endblock %}
