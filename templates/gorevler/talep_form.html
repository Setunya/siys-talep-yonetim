{% extends 'base.html' %}

{% block baslik %}Yeni Talep{% endblock %}

{% block icerik %}

<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title mb-4">Yeni Talep Oluştur</h5>

        <form method="post">
          {% csrf_token %}

          {% for alan in form %}
            <div class="mb-3">
              <label class="form-label">{{ alan.label }}</label>
              {{ alan }}
              {% if alan.errors %}
                <div class="text-danger small">{{ alan.errors }}</div>
              {% endif %}
            </div>
          {% endfor %}

          <button type="submit" class="btn btn-primary">Kaydet</button>
          <a href="{% url 'talep_listesi' %}" class="btn btn-secondary">İptal</a>
        </form>

      </div>
    </div>
  </div>
</div>

{% endblock %}
