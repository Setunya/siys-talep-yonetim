{% extends 'base.html' %}
{% block baslik %}Talep Arşivle{% endblock %}
{% block icerik %}

<div class="card">
  <div class="card-body">
    <h5 class="card-title text-danger">Talebi Arşivle</h5>
    <p>Bu talebi arşivlemek istediğinizden emin misiniz?</p>
    <p><strong>{{ talep.baslik }}</strong> — {{ talep.birim.ad }}</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Evet, Arşivle</button>
      <a href="{% url 'talep_detay' talep.id %}" class="btn btn-secondary">İptal</a>
    </form>
  </div>
</div>

{% endblock %}
